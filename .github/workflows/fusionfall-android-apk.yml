name: FusionFall Android APK (Unity)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android IL2CPP APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out development source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate source configuration
        run: python3 tools/check-fork-config.py
      - name: Validate Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo "::error::Unity licensing is not configured. See docs/FUSIONFALL_ANDROID.md and GameCI activation docs. Never commit or chat-send credentials."
            exit 1
          fi
      - name: Build Android APK with Unity 2022.3.62f3
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f3
          buildMethod: OpenFusion.EditorTools.FusionFallCiBuild.BuildAndroid
          androidExportType: androidPackage
          versioning: None
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Android-v0.1.0-unsigned-release
          path: build/Android/FusionFall-Android-v0.1.0.apk
          if-no-files-found: error
          retention-days: 14
