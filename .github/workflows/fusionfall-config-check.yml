name: FusionFall Android source configuration

on:
  push:
    branches: [fusionfall-android-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check fork identity, release channel, and FPS options
        run: python3 tools/check-fork-config.py
